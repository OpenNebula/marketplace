---
id: 'd3c8ea14-f6f0-455c-8a41-6129affa9a0e'
name: Open OnDemand
version: 7.4.0-0-20261005
publisher: OpenNebula Systems
description: |-
  [Open OnDemand](https://openondemand.org/) web portal for OneSlurm clusters. Users
  sign in with their LDAP account and use a web browser to manage files, submit
  and watch jobs and open a terminal on the clusters.

  The portal runs no Slurm of its own. It sends the Slurm commands of each user to
  the controller of the cluster over SSH. The clusters and the portal share the
  same LDAP directory and the same NFS export for /home. Attach the VM to the
  network of the clusters.

  See the [documentation](https://github.com/OpenNebula/one-apps/wiki/ood_intro).
short_description: Appliance with the Open OnDemand portal for OneSlurm clusters
tags:
- open-ondemand
- slurm
- hpc
- service
- ubuntu
format: qcow2
creation_time: 1791288942
os-id: Ubuntu
os-release: 26.04 LTS
os-arch: x86_64
hypervisor: KVM
opennebula_version: '7.4'
opennebula_template:
  context:
    network: 'YES'
    oneapp_home_nfs_export: "$ONEAPP_HOME_NFS_EXPORT"
    oneapp_ldap_server_domain: "$ONEAPP_LDAP_SERVER_DOMAIN"
    oneapp_ldap_server_url: "$ONEAPP_LDAP_SERVER_URL"
    oneapp_slurm_clusters_list: "$ONEAPP_SLURM_CLUSTERS_LIST"
    report_ready: 'YES'
    set_hostname: "$NAME"
    ssh_public_key: "$USER[SSH_PUBLIC_KEY]"
    token: 'YES'
  cpu: '2'
  vcpu: '2'
  graphics:
    listen: 0.0.0.0
    type: vnc
  inputs_order: >-
    ONEAPP_LDAP_SERVER_URL,ONEAPP_LDAP_SERVER_DOMAIN,ONEAPP_HOME_NFS_EXPORT,ONEAPP_SLURM_CLUSTERS_LIST
  memory: '4096'
  os:
    arch: x86_64
  user_inputs:
    # ─── LDAP ───
    ONEAPP_LDAP_SERVER_URL: "M|text|LDAP URL (ldap://host)| |"
    ONEAPP_LDAP_SERVER_DOMAIN: "M|text|LDAP domain or base DN| |slurm.local"
    # ─── HOME ───
    ONEAPP_HOME_NFS_EXPORT: "M|text|NFS export for /home (host:/export)| |"
    # ─── SLURM ───
    ONEAPP_SLURM_CLUSTERS_LIST: "M|text|Slurm clusters, one per line (name:controller IP)| |"
  user_inputs_metadata:
  - NAME: LDAP
    TITLE: LDAP
    TYPE: APP
    DESCRIPTION: "Users sign in with their LDAP account."
  - NAME: SERVER
    TITLE: Server
    TYPE: GROUP
    DESCRIPTION: "Use the LDAP server of the Slurm clusters."
  - NAME: HOME
    TITLE: Home
    TYPE: APP
    DESCRIPTION: "Home directories shared with the Slurm clusters."
  - NAME: NFS
    TITLE: NFS
    TYPE: GROUP
    DESCRIPTION: "Use the same export as the clusters. Each user needs a home there."
  - NAME: SLURM
    TITLE: Slurm
    TYPE: APP
    DESCRIPTION: "Slurm clusters where users run jobs. Note: you have to add the network of the clusters in Advanced options > Network."
  - NAME: CLUSTERS
    TITLE: Clusters
    TYPE: GROUP
    DESCRIPTION: "For example cpu:10.0.0.20. Each cluster uses the same LDAP and /home."
